import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import net.fabricmc.loom.task.RemapJarTask

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'com.gradleup.shadow' version '9.3.1'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

configurations {
	fabricApi {}
}

loom {
	noIntermediateMappings()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {}

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	fabricApi "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('collectFapiMetadata', CollectMetadataTask) {
	group 'build'

	archiveClassifier = 'metadata'
	mods = project.configurations.fabricApi
}

tasks.register('shadeFapiJar', ShadowJar) {
	group 'build'
	dependsOn 'collectFapiMetadata'

	archiveClassifier = 'new'
	configurations = [project.configurations.fabricApi]
	include 'net/fabricmc/fabric/api/**/*.class'
	exclude '**/package-info.class'
}

tasks.register('remapFapiJar', RemapJarTask) {
	group 'build'
	dependsOn 'shadeFapiJar'

	archiveClassifier = 'old'
	inputFile = tasks.shadeFapiJar.archiveFile
	classpath = sourceSets.main.compileClasspath

	customMappings = files('renames.tiny')
	sourceNamespace = 'renamed'
	targetNamespace = 'old'
}

tasks.register('stubFapiJar', StubJarTask) {
	group 'build'
	dependsOn 'remapFapiJar', 'collectFapiMetadata'

	archiveClassifier = 'stub'
	inputJars = files(tasks.remapFapiJar.archiveFile, tasks.collectFapiMetadata.archiveFile)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			artifact(tasks.stubFapiJar) {
				classifier = null
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
